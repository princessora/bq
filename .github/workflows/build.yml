name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      # 给 APK 加上递增的 run 编号后缀（如 app-debug-r15.apk），
      # 避免每次下载解压后都叫同名覆盖导致 vivo 拒绝安装。
      - name: Rename APK with run number
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/app-debug-r${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug-r${GITHUB_RUN_NUMBER}.apk
